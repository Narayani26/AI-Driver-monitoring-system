# Cloud backend + PostgreSQL in one command:
#   cp .env.example .env        # then put real secrets in .env
#   docker compose up -d        # dashboard -> http://localhost:9000
#   docker compose exec cloud python -m dms.cloud.app --make-admin you@example.com
# Data lives in the named volume "pgdata" (survives restarts and upgrades).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # no "ports:" on purpose: the database is reachable only by the backend, not from outside

  cloud:
    build: .
    command: ["python", "-m", "dms.cloud.app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      DMS_DATABASE_URL: postgresql+psycopg://dms:${POSTGRES_PASSWORD}@db:5432/dms
      DMS_CLOUD_SECRET: ${DMS_CLOUD_SECRET:?set DMS_CLOUD_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"   # put an HTTPS reverse proxy (Caddy/nginx) in front for real users
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
