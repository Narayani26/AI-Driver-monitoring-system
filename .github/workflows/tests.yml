name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for MediaPipe / OpenCV
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1
      - name: Install (CPU-only PyTorch keeps CI fast)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm opencv-python-headless numpy pandas scikit-learn matplotlib onnx onnxruntime pytest mediapipe fastapi httpx uvicorn sqlalchemy "psycopg[binary]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Training smoke test on synthetic data
        run: |
          PYTHONPATH=. python scripts/make_synthetic.py /tmp/synth
          python -m dms.training.train_temporal /tmp/synth/seq --folds 3 --epochs 2 --steps-per-epoch 20 --out /tmp/synth/runs/t
          python -m dms.training.train_image --kind face --manifest /tmp/synth/face.csv --no-pretrained --backbone mobilenetv3_small_100 --epochs 1 --bs 8 --max-steps 3 --workers 0 --img-size 96 --out /tmp/synth/runs/face
  postgres:
    # the cloud backend's tests again, on a real PostgreSQL server (the production database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dms
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dms" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm numpy pandas scikit-learn matplotlib pytest fastapi httpx uvicorn sqlalchemy "psycopg[binary]" opencv-python-headless
      - name: Backend tests on PostgreSQL
        env:
          DMS_TEST_DATABASE_URL: postgresql+psycopg://dms:ci@localhost:5432/dms
        run: python -m pytest -q tests/test_cloud.py -k "not training_window"
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build the edge image (verifies model checksums inside the build)
        run: docker build -t dms .
      - name: Smoke test the image
        run: |
          docker run -d --name dms -e DMS_TOKEN=ci -p 127.0.0.1:8000:8000 dms
          for i in $(seq 1 60); do docker exec dms curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          docker exec dms curl -fs http://127.0.0.1:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/?token=ci')" = "200"
